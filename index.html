<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vela Virtual — Espaço de Oração e Contemplação</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- SDKs do Firebase (Versão Compatível Web) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: #e2d9cc;
            min-height: 100vh;
            overflow-x: hidden;
            background-color: #05050a;
        }

        /* Imagem de Fundo Contemplativa com Animação de Respiração */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("can-karakoc-rVG7mLtEIKQ-unsplash.jpg") center/cover no-repeat;
            filter: blur(8px) brightness(0.28);
            transform: scale(1.1);
            z-index: 0;
            animation: bgBreath 25s ease-in-out infinite alternate;
        }

        @keyframes bgBreath {
            0% { transform: scale(1.1); filter: blur(8px) brightness(0.28); }
            100% { transform: scale(1.18); filter: blur(12px) brightness(0.33); }
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(20, 16, 38, 0.95);
            border: 1px solid rgba(255, 200, 100, 0.4);
            color: #f5e6c8;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.9em;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6), 0 0 15px rgba(255, 180, 50, 0.2);
            backdrop-filter: blur(10px);
            z-index: 1000;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Controle de Áudio Flutuante */
        .audio-control {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 100;
            background: rgba(15, 12, 28, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 200, 100, 0.2);
            border-radius: 50px;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
            color: #f5e6c8;
            font-size: 0.85em;
            letter-spacing: 0.5px;
        }

        .audio-control:hover {
            border-color: rgba(255, 200, 100, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 180, 50, 0.2);
        }

        header {
            text-align: center;
            padding: 70px 20px 30px;
            position: relative;
            z-index: 1;
            animation: fadeDown 1.4s ease;
        }

        header h1 {
            font-family: "Cormorant Garamond", serif;
            font-size: 3.4em;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: 3px;
            color: #fcebd0;
            text-shadow: 0 0 35px rgba(255, 180, 50, 0.35), 0 2px 6px rgba(0, 0, 0, 0.8);
        }

        header p {
            color: #a8a29e;
            font-size: 1.1em;
            font-weight: 300;
            letter-spacing: 1px;
            max-width: 600px;
            margin: 0 auto 20px;
        }

        .quote-box {
            font-family: "Cormorant Garamond", serif;
            font-style: italic;
            font-size: 1.25em;
            color: #d4af37;
            opacity: 0.85;
            margin-top: 15px;
            letter-spacing: 0.5px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .card {
            background: rgba(10, 9, 20, 0.82);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 200, 100, 0.12);
            border-radius: 24px;
            padding: 40px;
            margin-bottom: 40px;
            box-shadow: 0 12px 45px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            animation: fadeUp 1s ease;
        }

        .card h2 {
            font-family: "Cormorant Garamond", serif;
            margin-bottom: 24px;
            font-size: 1.8em;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: #f5e6c8;
            border-bottom: 1px solid rgba(255, 200, 100, 0.1);
            padding-bottom: 12px;
        }

        .filter-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .filter-btn {
            background: rgba(255, 200, 100, 0.05);
            border: 1px solid rgba(255, 200, 100, 0.15);
            color: #a8a29e;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.82em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background: rgba(255, 180, 50, 0.2);
            border-color: rgba(255, 200, 100, 0.5);
            color: #fcebd0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #a8a29e;
            font-size: 0.82em;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        input, select, textarea {
            width: 100%;
            padding: 15px 20px;
            margin-bottom: 22px;
            border: 1px solid rgba(255, 200, 100, 0.15);
            border-radius: 12px;
            background: rgba(5, 5, 14, 0.85);
            color: #f3ece0;
            font-size: 1em;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: rgba(255, 180, 50, 0.5);
            box-shadow: 0 0 18px rgba(255, 180, 50, 0.15);
            background: rgba(8, 8, 22, 0.95);
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        button.btn-acender {
            background: linear-gradient(135deg, #c23152, #7a1532);
            color: #fff;
            border: none;
            padding: 16px 40px;
            border-radius: 12px;
            font-size: 1.05em;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.35s ease;
            box-shadow: 0 4px 20px rgba(194, 49, 82, 0.35);
            display: block;
            width: 100%;
        }

        button.btn-acender:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(194, 49, 82, 0.55);
            background: linear-gradient(135deg, #d83b5f, #941b3f);
        }

        .velas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 28px;
        }

        .vela-card {
            background: rgba(12, 10, 24, 0.88);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 200, 100, 0.1);
            border-radius: 20px;
            padding: 32px 24px 24px;
            text-align: center;
            position: relative;
            animation: fadeUp 0.8s ease;
            transition: transform 0.4s cubic-bezier(.25,.46,.45,.94), box-shadow 0.4s, border-color 0.4s;
        }

        .vela-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 45px rgba(0,0,0,0.7), 0 0 35px rgba(255, 180, 50, 0.1);
            border-color: rgba(255, 200, 100, 0.25);
        }

        .candle-container {
            position: relative;
            height: 90px;
            margin-bottom: 10px;
        }

        .candle {
            width: 22px;
            height: 55px;
            background: linear-gradient(to bottom, #f7ebd9, #cf9d72);
            margin: 30px auto 0;
            border-radius: 4px 4px 2px 2px;
            position: relative;
            box-shadow: 2px 4px 10px rgba(0,0,0,0.5);
        }

        .candle::before {
            content: "";
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 7px;
            background: #2a2a2a;
        }

        .smoke {
            position: absolute;
            top: -45px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 8px;
            background: rgba(200, 200, 200, 0.3);
            border-radius: 50%;
            filter: blur(4px);
            animation: smokeRise 3s ease-out infinite;
            pointer-events: none;
        }

        @keyframes smokeRise {
            0% { opacity: 0.4; transform: translateX(-50%) translateY(0) scale(1); }
            50% { opacity: 0.2; transform: translateX(-80%) translateY(-18px) scale(2.2); }
            100% { opacity: 0; transform: translateX(-20%) translateY(-35px) scale(3.5); }
        }

        .flame {
            position: absolute;
            top: -32px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 26px;
            background: radial-gradient(ellipse at bottom, #ff4500 0%, #ff8c00 30%, #ffd700 60%, transparent 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: flame .35s infinite alternate ease-in-out;
            filter: blur(0.6px);
            box-shadow: 0 0 10px #ff6b00, 0 0 20px #ffa500, 0 0 35px rgba(255,165,0,0.3);
        }

        @keyframes flame {
            0% { transform: translateX(-50%) scale(1) rotate(-1.5deg); }
            50% { transform: translateX(-49%) scale(0.95) rotate(0.8deg); }
            100% { transform: translateX(-51%) scale(1.06) rotate(1.8deg); }
        }

        .glow {
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 110px;
            background: radial-gradient(circle, rgba(255, 170, 0, 0.18) 0%, rgba(255, 120, 0, 0.05) 45%, transparent 70%);
            border-radius: 50%;
            animation: glow 2.5s infinite alternate ease-in-out;
            pointer-events: none;
        }

        @keyframes glow {
            0% { opacity: 0.45; transform: translateX(-50%) scale(0.88); }
            100% { opacity: 0.95; transform: translateX(-50%) scale(1.25); }
        }

        .vela-card h3 {
            font-family: "Cormorant Garamond", serif;
            margin: 12px 0 6px;
            font-size: 1.3em;
            font-weight: 600;
            color: #fcebd0;
            letter-spacing: 0.5px;
        }

        .vela-card .intencao {
            color: #b0a89e;
            font-size: 0.9em;
            margin-bottom: 16px;
            min-height: 40px;
            line-height: 1.6;
            font-weight: 300;
            font-style: italic;
        }

        .vela-card .causa {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(255, 180, 50, 0.08);
            border: 1px solid rgba(255, 200, 100, 0.2);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.75em;
            margin-bottom: 14px;
            color: #f5d78e;
            font-weight: 500;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .rezar-btn {
            background: linear-gradient(135deg, #3d2065, #22103b);
            color: #e2d9cc;
            border: 1px solid rgba(160, 120, 220, 0.2);
            padding: 10px 24px;
            font-size: 0.88em;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
            width: 100%;
        }

        .rezar-btn:hover {
            background: linear-gradient(135deg, #533483, #321854);
            border-color: rgba(180, 140, 240, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(83, 52, 131, 0.4);
        }

        .contador {
            margin-top: 10px;
            font-size: 0.8em;
            color: #f5d78e;
            font-weight: 400;
            letter-spacing: 0.3px;
            opacity: 0.85;
        }

        .vazio {
            text-align: center;
            color: #777;
            padding: 50px 20px;
            font-size: 1.05em;
            font-weight: 300;
            font-style: italic;
            grid-column: 1 / -1;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 1.5px;
            height: 1.5px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 4s infinite alternate ease-in-out;
        }

        @keyframes twinkle {
            0% { opacity: 0.05; }
            50% { opacity: 0.5; }
            100% { opacity: 0.1; }
        }
    </style>
</head>
<body>

    <!-- Notificação Toast -->
    <div id="toast" class="toast">🙏 Sua prece foi unida com carinho.</div>

    <div class="stars" id="stars"></div>

    <div class="audio-control" onclick="toggleAudio()">
        <span id="audio-icon">🎵</span>
        <span id="audio-text">Som Ambiente</span>
    </div>

    <audio id="ambient-audio" loop preload="auto">
    <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <header>
        <h1>🕯️ Vela Virtual</h1>
        <p>Um santuário silencioso para suas preces, intenções e momentos de contemplação.</p>
        <div class="quote-box" id="quote">"A luz que você acende ilumina não apenas o seu caminho, mas o de todos ao seu redor."</div>
    </header>

    <div class="container">
        <div class="card">
            <h2>🔥 Acender uma Vela</h2>
            
            <label for="nome">Seu nome (ou deixe em branco para Anônimo)</label>
            <input id="nome" placeholder="Ex: Maria, João..." maxlength="30">

            <label for="causa">Intenção / Causa</label>
            <select id="causa">
                <option value="Saúde">Saúde & Cura</option>
                <option value="Paz">Paz Interior & Tranquilidade</option>
                <option value="Gratidão">Gratidão</option>
                <option value="Família">Família & Entes Queridos</option>
                <option value="Falecimento">Em Memória de Alguém</option>
                <option value="Trabalho">Trabalho & Projetos</option>
                <option value="Outra">Outra Intenção</option>
            </select>

            <label for="intencao">Sua Oração ou Pedido</label>
            <textarea id="intencao" placeholder="Escreva a sua prece ou pensamento com carinho..."></textarea>

            <button class="btn-acender" onclick="acenderVela()">🕯️ Acender Esta Vela</button>
        </div>

        <div class="card">
            <h2>🙏 Velas em Oração</h2>
            
            <div class="filter-container">
                <button class="filter-btn active" onclick="filtrarVelas('Todas', this)">Todas</button>
                <button class="filter-btn" onclick="filtrarVelas('Saúde', this)">❤️ Saúde</button>
                <button class="filter-btn" onclick="filtrarVelas('Paz', this)">🕊️ Paz</button>
                <button class="filter-btn" onclick="filtrarVelas('Gratidão', this)">✨ Gratidão</button>
                <button class="filter-btn" onclick="filtrarVelas('Família', this)">🏠 Família</button>
                <button class="filter-btn" onclick="filtrarVelas('Falecimento', this)">🤍 Em Memória</button>
                <button class="filter-btn" onclick="filtrarVelas('Trabalho', this)">💼 Trabalho</button>
            </div>

            <div id="mural" class="velas-grid"></div>
        </div>
    </div>

    <script>
        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDUk3m16VrFgxgqc2a4g5pCyh-0ZSPmkCk",
            authDomain: "vela-virtual-55f1d.firebaseapp.com",
            projectId: "vela-virtual-55f1d",
            storageBucket: "vela-virtual-55f1d.firebasestorage.app",
            messagingSenderId: "532144867880",
            appId: "1:532144867880:web:2fc8d43abc50c086a5431d",
            measurementId: "G-HJDWWDVWKR"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const iconesCausa = {
            'Saúde': '❤️',
            'Paz': '🕊️',
            'Gratidão': '✨',
            'Família': '🏠',
            'Falecimento': '🤍',
            'Trabalho': '💼',
            'Outra': '🕯️'
        };

        for (var i = 0; i < 50; i++) {
            var s = document.createElement("div");
            s.className = "star";
            s.style.left = Math.random() * 100 + "%";
            s.style.top = Math.random() * 100 + "%";
            s.style.animationDelay = Math.random() * 4 + "s";
            s.style.animationDuration = (3 + Math.random() * 4) + "s";
            document.getElementById("stars").appendChild(s);
        }

        const quotes = [
            '"A luz que você acende ilumina não apenas o seu caminho, mas o de todos ao seu redor."',
            '"Onde há fé e silêncio, há uma chama que jamais se apaga."',
            '"Cada oração é uma ponte de luz erguida no silêncio da alma."',
            '"A paz começa no momento em que você entrega o seu coração."'
        ];
        document.getElementById("quote").innerText = quotes[Math.floor(Math.random() * quotes.length)];

        let audioPlaying = false;
        function toggleAudio() {
            const audio = document.getElementById("ambient-audio");
            const icon = document.getElementById("audio-icon");
            const text = document.getElementById("audio-text");

            if (audioPlaying) {
                audio.pause();
                icon.innerText = "🎵";
                text.innerText = "Som Ambiente";
                audioPlaying = false;
            } else {
                audio.play().then(() => {
                    icon.innerText = "🔊";
                    text.innerText = "Pausar Som";
                    audioPlaying = true;
                }).catch(e => {
                    console.log("Ação do usuário necessária para tocar o som.");
                });
            }
        }

        function mostrarToast(mensagem) {
            const toast = document.getElementById("toast");
            toast.innerText = mensagem;
            toast.classList.add("show");
            setTimeout(() => {
                toast.classList.remove("show");
            }, 3000);
        }

        let velasGerais = [];
        let filtroAtual = 'Todas';

        // Escutar banco de dados em tempo real
        db.collection("velas").orderBy("dataCriacao", "desc").onSnapshot(snapshot => {
            velasGerais = [];
            snapshot.forEach(doc => {
                velasGerais.push({ id: doc.id, ...doc.data() });
            });
            renderizar();
        }, err => {
            console.log("Aguardando ativação das regras do Firestore.");
        });

        function acenderVela() {
            var nome = document.getElementById("nome").value.trim() || "Anônimo";
            var causa = document.getElementById("causa").value;
            var intencao = document.getElementById("intencao").value.trim();

            if (!intencao) {
                alert("Por favor, escreva a sua intenção ou oração antes de acender a vela.");
                return;
            }

            db.collection("velas").add({
                nome: nome,
                causa: causa,
                intencao: intencao,
                rezas: 0,
                data: new Date().toLocaleDateString("pt-BR"),
                dataCriacao: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                mostrarToast("🕯️ Sua vela foi acesa no mural.");
                document.getElementById("nome").value = "";
                document.getElementById("intencao").value = "";
                if (!audioPlaying) toggleAudio();
            }).catch(e => {
                alert("Verifique se o Firestore Database foi ativado no console.");
            });
        }

        function rezar(id) {
            db.collection("velas").doc(id).update({
                rezas: firebase.firestore.FieldValue.increment(1)
            }).then(() => {
                mostrarToast("🙏 Sua prece foi unida com carinho.");
            });
        }

        function filtrarVelas(categoria, el) {
            filtroAtual = categoria;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if (el) el.classList.add('active');
            renderizar();
        }

        function renderizar() {
            var mural = document.getElementById("mural");
            
            var velasExibidas = filtroAtual === 'Todas' 
                ? velasGerais 
                : velasGerais.filter(v => v.causa === filtroAtual);

            if (!velasExibidas.length) {
                mural.innerHTML = '<div class="vazio">Nenhuma vela acesa nesta categoria no momento. Seja a primeira pessoa a acender uma chama. 🕯️</div>';
                return;
            }

            mural.innerHTML = velasExibidas.map(function(v) {
                var icone = iconesCausa[v.causa] || '🕯️';
                return '<div class="vela-card">' +
                    '<div class="candle-container">' +
                        '<div class="glow"></div>' +
                        '<div class="smoke"></div>' +
                        '<div class="candle">' +
                            '<div class="flame"></div>' +
                        '</div>' +
                    '</div>' +
                    '<h3>' + v.nome + '</h3>' +
                    '<span class="causa">' + icone + ' ' + v.causa + '</span>' +
                    '<p class="intencao">"' + v.intencao + '"</p>' +
                    '<p style="font-size: 0.72em; color: #666; margin-bottom: 14px; letter-spacing: 0.3px;">' + (v.data || '') + '</p>' +
                    '<button class="rezar-btn" onclick="rezar(\'' + v.id + '\')">🙏 Unir em Oração</button>' +
                    '<div class="contador">' + (v.rezas || 0) + ' ' + (v.rezas === 1 ? 'prece unida' : 'preces unidas') + '</div>' +
                '</div>';
            }).join("");
        }
    </script>
</body>
</html>
